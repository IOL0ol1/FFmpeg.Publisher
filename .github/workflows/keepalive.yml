name: Keep Repo Active
on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:  # Grant write access
  contents: write
  
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update README with precise time
        run: |
          # Get the current time (to the second, format: YYYY-MM-DD HH:MM:SS)
          CURRENT_TIME=$(date +'%Y-%m-%d %H:%M:%S')

          # Replace the last line of README.md
          sed -i "\$s/.*/Last updated: $CURRENT_TIME/" README.md

          # Commit the change
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Update README with precise time"
          git push
